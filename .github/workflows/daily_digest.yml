name: AI × Crypto Daily Digest

on:
  schedule:
    - cron: '0 1 * * *'   # 1:00 AM UTC = 9:00 AM Philippine Time (PHT)
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.8703856265:AAHFmPIIIF5KU4_R9WSMxmW_niYt9byaIcA }}
          TELEGRAM_CHAT_ID: ${{ secrets.8386973993 }}
          TIMEZONE: Asia/Manila
        run: python bot.py

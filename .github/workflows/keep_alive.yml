name: Repo Keep-Alive

on:
  schedule:
    - cron: '0 0 1,15 * *'   # runs on the 1st and 15th of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update keep-alive timestamp
        run: |
          mkdir -p .github
          echo "Last keep-alive ping: $(date -u '+%Y-%m-%d %H:%M UTC')" > .github/KEEP_ALIVE.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/KEEP_ALIVE.md
          git diff --staged --quiet || git commit -m "chore: keep-alive ping"
          git push

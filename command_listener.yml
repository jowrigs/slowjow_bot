name: Telegram Command Listener

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes — GitHub's minimum interval
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: Asia/Manila
        run: python commands.py

      - name: Commit updated offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f telegram_offset.json ]; then
            git add telegram_offset.json
            git diff --staged --quiet || git commit -m "chore: update telegram offset"
            git push
          fi
